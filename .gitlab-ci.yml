stages:
  - checks
  - test
  - deploy

.tox_setup:
  before_script:
    - apt-get update
    - apt-get install redis-server -y
    - redis-server --daemonize yes
    - python -V
    - pip install tox

pre-commit:
  stage: checks
  image: python:3.12-bookworm
  variables:
    PRE_COMMIT_HOME: ${CI_PROJECT_DIR}/.cache/pre-commit
  cache:
    paths:
      - ${PRE_COMMIT_HOME}
  script:
    - pip install pre-commit
    - pre-commit run --all-files

pylint:
  stage: checks
  extends: .tox_setup
  image: python:3.10-bookworm
  script:
    - tox -e pylint

test-py310:
  extends: .tox_setup
  image: python:3.$PYTHON_VERSION-bookworm
  parallel:
    matrix:
      - ESI_VERSION: [8]
        PYTHON_VERSION: [10, 11, 12]
        DJANGO_VERSION: [42, 52]
      - ESI_VERSION: [9]
        PYTHON_VERSION: [10, 11, 12, 13]
        DJANGO_VERSION: [52, 60]
  script:
    - tox -e py3$PYTHON_VERSION-django$DJANGO_VERSION-esi$ESI_VERSION
    - bash <(curl -s https://codecov.io/bash)

test-docs:
  stage: test
  image: python:3.12-bookworm
  before_script:
    - pip install tox
  script:
    - tox -e docs

deploy-pypi:
  stage: deploy
  image: python:3.12-bookworm

  before_script:
    - pip install build wheel twine

  script:
    - python -m build
    - twine upload dist/*

  only:
    - tags

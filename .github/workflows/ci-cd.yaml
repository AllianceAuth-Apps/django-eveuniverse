name: CI/CD Pipeline

on: push

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install redis
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: latest

      - name: Verify that redis is up
        run: redis-cli ping

      - name: Run Pylint
        run: |
          pip install tox
          tox -e pylint

  test:
    runs-on: ubuntu-latest
    needs: [pre-commit, pylint]
    strategy:
      matrix:
        esi-version: ["8", "9"]
        python-version: ["10", "11", "12", "13"]
        django-version: ["42", "52", "60"]
        exclude:
          # Exclude combinations for ESI 8 that shouldn't run
          - esi-version: "8"
            python-version: "13"
          - esi-version: "8"
            django-version: "60"
          # Exclude combinations for ESI 9 that shouldn't run
          - esi-version: "9"
            django-version: "42"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.${{ matrix.python-version }}"

      - name: Install redis
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: latest

      - name: Verify that redis is up
        run: redis-cli ping

      - name: Run Tests
        run: |
          pip install tox
          tox -e py3${{ matrix.python-version }}-django${{ matrix.django-version }}-esi${{ matrix.esi-version }}

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: AllianceAuth-Apps/django-eveuniverse

  test-docs:
    runs-on: ubuntu-latest
    needs: [pre-commit, pylint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install redis
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: latest

      - name: Verify that redis is up
        run: redis-cli ping

      - name: Run Tests
        run: |
          pip install tox
          tox -e docs


  publish:
    needs: [test, test-docs]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Flit
        run: pip install flit

      - name: Build and Publish
        run: flit publish
        env:
          FLIT_USERNAME: ${{ secrets.FLIT_USERNAME }}
          FLIT_PASSWORD: ${{ secrets.FLIT_PASSWORD }}
